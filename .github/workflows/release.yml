name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alfredwamugi/gatekeeper
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GATEKEEPER_VERSION=${{ github.ref_name }}
            GATEKEEPER_COMMIT=${{ github.sha }}

      - name: Build release installer tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          PKG_DIR="gatekeeper-edge-${VERSION}"
          mkdir -p "${PKG_DIR}/systemd"
          cp -R deploy "${PKG_DIR}/deploy"
          cp docker-compose.yml "${PKG_DIR}/docker-compose.yml"
          cp deploy/gatekeeper.service "${PKG_DIR}/systemd/gatekeeper.service"
          cp deploy/install.sh "${PKG_DIR}/install.sh"
          tar -czf "gatekeeper-edge-${VERSION}.tar.gz" "${PKG_DIR}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            gatekeeper-edge-${{ github.ref_name }}.tar.gz

